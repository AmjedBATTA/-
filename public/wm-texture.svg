<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" fill="none">
  <!-- Repeating themed texture: Greek meander + laurel + pharmacy motifs -->
  <g stroke="#7A5220" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.085" fill="none">

    <!-- Greek key (meander) spiral — top-left -->
    <path d="M20 70 L 20 30 L 60 30 L 60 58 L 40 58 L 40 44 L 50 44" stroke-width="2.4"/>

    <!-- Mortar & pestle — pharmacy — top-right -->
    <g stroke-width="2.2">
      <path d="M188 44 C 188 60, 200 70, 214 70 C 228 70, 240 60, 240 44"/>
      <path d="M184 42 L 244 42"/>
      <path d="M214 70 L 214 82 M 198 84 L 230 84"/>
      <line x1="222" y1="22" x2="232" y2="40"/>
    </g>

    <!-- Rod of Asclepius (mini) — center -->
    <g stroke-width="2">
      <path d="M130 110 L 130 168"/>
      <path d="M130 162 C 112 156, 112 144, 130 138 C 148 132, 148 120, 130 114"/>
      <circle cx="130" cy="108" r="3"/>
    </g>

    <!-- Laurel branch — bottom-left -->
    <g stroke-width="2">
      <path d="M28 232 C 44 216, 52 190, 50 168"/>
      <path d="M40 220 q -12 -2 -16 -12" />
      <path d="M46 206 q -12 -2 -16 -12" />
      <path d="M50 190 q -11 -3 -14 -13" />
      <path d="M44 214 q 10 -6 9 -18" />
      <path d="M49 198 q 10 -6 9 -18" />
    </g>

    <!-- Capsule pill — bottom-right -->
    <g stroke-width="2.2">
      <rect x="196" y="196" width="46" height="22" rx="11" transform="rotate(-32 219 207)"/>
      <line x1="214" y1="190" x2="224" y2="224" transform="rotate(-32 219 207)" stroke-opacity="0.04"/>
    </g>

    <!-- Greek key (meander) spiral — bottom-center small -->
    <path d="M104 244 L 104 218 L 130 218 L 130 236 L 117 236 L 117 227 L 124 227" stroke-width="2"/>

    <!-- Rx symbol — center-left -->
    <g stroke-width="2.2">
      <path d="M70 128 L 70 158 M 70 128 L 82 128 Q 90 128 90 137 Q 90 146 80 146 L 70 146 M 80 146 L 92 160"/>
      <line x1="86" y1="150" x2="96" y2="162"/>
    </g>

  </g>
</svg>
