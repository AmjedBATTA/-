<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" fill="none">
  <!-- Greek temple facade — the dwelling of the gods (Asclepieion / Parthenon style) -->
  <g stroke="#7A5220" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.12">
    <!-- Pediment (triangular gable) -->
    <path d="M22 92 L 190 22 L 358 92 Z" stroke-width="3"/>
    <!-- Inner pediment line -->
    <path d="M48 88 L 190 30 L 332 88" stroke-width="1.5" stroke-opacity="0.05"/>
    <!-- Acroterion (apex ornament) -->
    <path d="M190 22 L 190 12 M 184 16 Q 190 6 196 16" stroke-width="2"/>
    <!-- Entablature / architrave -->
    <rect x="30" y="96" width="320" height="20" stroke-width="3"/>
    <!-- Triglyph hints on the frieze -->
    <g stroke-width="1.2" stroke-opacity="0.05">
      <line x1="70" y1="98" x2="70" y2="114"/>
      <line x1="130" y1="98" x2="130" y2="114"/>
      <line x1="190" y1="98" x2="190" y2="114"/>
      <line x1="250" y1="98" x2="250" y2="114"/>
      <line x1="310" y1="98" x2="310" y2="114"/>
    </g>
    <!-- Six Doric columns -->
    <g stroke-width="2.5">
      <path d="M58 124 L 58 244"/>
      <path d="M118 124 L 118 244"/>
      <path d="M178 124 L 178 244"/>
      <path d="M202 124 L 202 244"/>
      <path d="M262 124 L 262 244"/>
      <path d="M322 124 L 322 244"/>
    </g>
    <!-- Column fluting (subtle inner lines) -->
    <g stroke-width="1" stroke-opacity="0.045">
      <path d="M64 130 L 64 240"/>
      <path d="M124 130 L 124 240"/>
      <path d="M184 130 L 184 240"/>
      <path d="M208 130 L 208 240"/>
      <path d="M268 130 L 268 240"/>
      <path d="M328 130 L 328 240"/>
    </g>
    <!-- Capitals -->
    <g stroke-width="2">
      <path d="M50 124 h22 M110 124 h22 M170 124 h22 M194 124 h22 M254 124 h22 M314 124 h22"/>
    </g>
    <!-- Stylobate (stepped base) -->
    <rect x="36" y="244" width="308" height="13" stroke-width="3"/>
    <rect x="22" y="257" width="336" height="12" stroke-width="3"/>
  </g>
</svg>
