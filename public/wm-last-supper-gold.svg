<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" fill="none">
  <!-- The Last Supper (العشاء الأخير) — after Leonardo da Vinci.
       Stylised gold line-engraving for dark luxury panels.
       One-point perspective converging on the central figure. -->
  <g stroke="#E8C485" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- ░░ Architecture: room in one-point perspective (VP ≈ 410,150) ░░ -->
    <g stroke-opacity="0.09" stroke-width="1.6">
      <!-- ceiling beams converging to vanishing point -->
      <path d="M34 44 L 410 150"/>
      <path d="M786 44 L 410 150"/>
      <path d="M150 40 L 410 150"/>
      <path d="M670 40 L 410 150"/>
      <!-- side walls lower edges -->
      <path d="M34 268 L 410 168"/>
      <path d="M786 268 L 410 168"/>
      <!-- ceiling cross beams (coffers) -->
      <path d="M120 78 L 700 78"/>
      <path d="M180 104 L 640 104"/>
      <path d="M232 126 L 588 126"/>
      <!-- top & side frame -->
      <path d="M34 44 L 786 44"/>
      <path d="M34 44 L 34 268"/>
      <path d="M786 44 L 786 268"/>
    </g>

    <!-- ░░ Back wall with three windows ░░ -->
    <g stroke-opacity="0.13" stroke-width="2">
      <!-- back wall panel -->
      <rect x="262" y="86" width="296" height="132"/>
      <!-- left window -->
      <rect x="284" y="104" width="54" height="92"/>
      <!-- right window -->
      <rect x="482" y="104" width="54" height="92"/>
    </g>
    <!-- central window behind the central figure — brightest (the focal halo) -->
    <g stroke-opacity="0.20" stroke-width="2.2">
      <path d="M372 196 L 372 120 Q 372 96 410 96 Q 448 96 448 120 L 448 196 Z"/>
      <!-- distant landscape horizon -->
      <path d="M376 162 Q 410 152 444 162" stroke-opacity="0.12" stroke-width="1.4"/>
      <path d="M384 170 Q 410 164 436 170" stroke-opacity="0.10" stroke-width="1.2"/>
    </g>
    <!-- pediment / lunette over the central window -->
    <path d="M360 96 Q 410 70 460 96" stroke-opacity="0.14" stroke-width="1.8"/>

    <!-- soft radiance behind the central head -->
    <circle cx="410" cy="214" r="34" stroke-opacity="0.10" stroke-width="1.4"/>
    <circle cx="410" cy="214" r="24" stroke-opacity="0.07" stroke-width="1.2"/>

    <!-- ░░ Long supper table ░░ -->
    <g stroke-opacity="0.15" stroke-width="2">
      <!-- table top back edge -->
      <path d="M118 300 L 702 300"/>
      <!-- table front edge -->
      <path d="M70 360 L 750 360"/>
      <!-- ends -->
      <path d="M118 300 L 70 360"/>
      <path d="M702 300 L 750 360"/>
    </g>
    <!-- tablecloth folds -->
    <g stroke-opacity="0.07" stroke-width="1.3">
      <path d="M150 304 L 140 358"/>
      <path d="M250 302 L 246 359"/>
      <path d="M350 301 L 349 360"/>
      <path d="M470 301 L 471 360"/>
      <path d="M570 302 L 576 359"/>
      <path d="M668 304 L 680 358"/>
    </g>
    <!-- plates & bread along the table -->
    <g stroke-opacity="0.10" stroke-width="1.3">
      <ellipse cx="170" cy="298" rx="13" ry="4"/>
      <ellipse cx="250" cy="297" rx="13" ry="4"/>
      <ellipse cx="330" cy="296" rx="13" ry="4"/>
      <ellipse cx="488" cy="296" rx="13" ry="4"/>
      <ellipse cx="568" cy="297" rx="13" ry="4"/>
      <ellipse cx="648" cy="298" rx="13" ry="4"/>
    </g>

    <!-- ░░ The thirteen figures ░░ -->
    <!-- robe + head; stroke groups for body and heads -->
    <g stroke-opacity="0.15" stroke-width="2">

      <!-- Far-left group of three -->
      <path d="M104 300 C 108 264 113 248 120 246 C 127 248 132 264 136 300"/>
      <circle cx="116" cy="224" r="12"/>
      <path d="M139 300 C 143 264 148 248 155 246 C 162 248 167 264 171 300"/>
      <circle cx="158" cy="219" r="12"/>
      <path d="M174 300 C 178 264 183 248 190 246 C 197 248 202 264 206 300"/>
      <circle cx="188" cy="222" r="12"/>

      <!-- Inner-left group of three (leaning toward centre) -->
      <path d="M254 300 C 258 264 263 248 270 246 C 277 248 282 264 286 300"/>
      <circle cx="266" cy="221" r="12"/>
      <path d="M284 300 C 288 264 293 248 300 246 C 307 248 312 264 316 300"/>
      <circle cx="303" cy="218" r="12"/>
      <path d="M314 300 C 318 264 323 248 330 246 C 337 248 342 264 346 300"/>
      <circle cx="332" cy="224" r="12"/>

      <!-- Inner-right group of three -->
      <path d="M454 300 C 458 264 463 248 470 246 C 477 248 482 264 486 300"/>
      <circle cx="468" cy="223" r="12"/>
      <path d="M484 300 C 488 264 493 248 500 246 C 507 248 512 264 516 300"/>
      <circle cx="497" cy="219" r="12"/>
      <path d="M514 300 C 518 264 523 248 530 246 C 537 248 542 264 546 300"/>
      <circle cx="533" cy="222" r="12"/>

      <!-- Far-right group of three -->
      <path d="M594 300 C 598 264 603 248 610 246 C 617 248 622 264 626 300"/>
      <circle cx="607" cy="221" r="12"/>
      <path d="M629 300 C 633 264 638 248 645 246 C 652 248 657 264 661 300"/>
      <circle cx="648" cy="219" r="12"/>
      <path d="M664 300 C 668 264 673 248 680 246 C 687 248 692 264 696 300"/>
      <circle cx="679" cy="223" r="12"/>
    </g>

    <!-- Central figure — calm triangular posture, arms opening to the table -->
    <g stroke-opacity="0.22" stroke-width="2.3">
      <!-- robe triangle -->
      <path d="M362 302 C 372 262 388 234 410 232 C 432 234 448 262 458 302"/>
      <!-- head -->
      <circle cx="410" cy="216" r="13"/>
      <!-- shoulders -->
      <path d="M392 244 Q 410 236 428 244"/>
      <!-- open arms reaching toward the table -->
      <path d="M398 250 L 360 296"/>
      <path d="M422 250 L 462 296"/>
      <!-- hands -->
      <path d="M356 296 q -4 4 -2 8" stroke-opacity="0.16"/>
      <path d="M466 296 q 4 4 2 8" stroke-opacity="0.16"/>
    </g>

    <!-- a few expressive gesture lines among the apostles -->
    <g stroke-opacity="0.12" stroke-width="1.6">
      <path d="M300 248 L 322 280"/>     <!-- pointing hand, inner-left -->
      <path d="M500 248 L 480 278"/>     <!-- raised hand, inner-right -->
      <path d="M158 246 L 176 276"/>     <!-- far-left gesture -->
      <path d="M648 246 L 632 276"/>     <!-- far-right gesture -->
    </g>

  </g>
</svg>
