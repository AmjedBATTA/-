# ينشر معاينة مؤقتة (preview channel) لكل Pull Request قبل الدمج،
# برابط منفصل لا يؤثر على الموقع الحي — يزول تلقائياً بعد أيام قليلة.
# يستخدم نفس السرّ FIREBASE_SERVICE_ACCOUNT_ANWAR_ALHASAN.
name: معاينة Firebase Hosting لكل Pull Request
on: pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANWAR_ALHASAN }}'
          projectId: anwar-alhasan
